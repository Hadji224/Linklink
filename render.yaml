# Déploiement Render : https://render.com → New → Blueprint → choisir ce dépôt.
# La base est hébergée à part (Neon, PostgreSQL) et les fichiers dans Google Drive : plus besoin de disque.
# Le plan gratuit convient (le service se met en veille après 15 min d'inactivité ; premier chargement ~1 min).
services:
  - type: web
    name: linklink-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: /tmp/linklink
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL      # adresse PostgreSQL (Neon)
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN       # adresse(s) de l'interface hébergée à part, séparées par des virgules
        sync: false
